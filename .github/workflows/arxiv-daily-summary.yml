name: arXiv Daily Summary
# Upgrade dispatches from arxiv-upgrade-poll.yml are titled "Upgrade <date>"; the poll
# reads these titles back to attempt each date only once.
run-name: ${{ inputs.upgrade_only && format('Upgrade {0} (journal-only → full)', inputs.target_date) || github.workflow }}

on:
  schedule:
    # Daily report — 13:00 KST (04:00 UTC), every day incl. weekends. arXiv's nominal
    # announce is 09-10 KST, but since 2026-10 /new often lands 11-13 KST. Generates the daily
    # (no-ops when arXiv has nothing new) and delivers its Slack in the same run.
    # When arXiv is late it publishes journal-only and arms arxiv-upgrade-poll.yml.
    - cron: "0 4 * * *"
    # Weekly retrospective — Monday 10:00 KST (01:00 UTC). Standalone run that
    # generates last week's weekly (mode=weekly) and delivers its Slack inline.
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, daily, backfill, weekly, or sunday"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - daily
          - backfill
          - weekly
          - sunday
      target_date:
        description: "Optional target date for backfill/daily, in YYYY-MM-DD"
        required: false
        type: string
      send_slack:
        description: "Send Slack notification via Slack bot (SLACK_BOT_TOKEN) if configured"
        required: false
        default: true
        type: boolean
      upgrade_only:
        description: "Upgrade dispatch: skip unless target_date is still journal-only (set by the upgrade poll)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # write: dispatch the Pages deploy and arm/disarm the upgrade poll.
  actions: write

concurrency:
  group: paper-daily-summary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Run arXiv Daily Briefing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKDIR: ${{ github.workspace }}
      GITHUB_REPO: IIL-SNU/paper-daily-summary
      SITE_URL: https://iilab.io/paper-daily-summary
      SLACK_CHANNEL: "#paper-daily-summary"
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}   # GitHub secret으로 주입(예: C0XXXXXXX). 비우면 SLACK_CHANNEL 이름 사용
      SEND_SLACK: ${{ github.event.inputs.send_slack || 'true' }}
      # Authenticate Claude Code with a subscription OAuth token (claude setup-token)
      # instead of a metered API key.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Slack bot token (xoxb-...) with chat:postMessage scope; bot must be invited to the channel.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Decide whether to run the agent at all, and in which mode, BEFORE installing
      # Claude. Daily/weekly/manual always proceed; an upgrade dispatch from the poll
      # proceeds only if its date is still journal-only.
      - name: Resolve run plan
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_DATE: ${{ github.event.inputs.target_date }}
          IN_UPGRADE_ONLY: ${{ github.event.inputs.upgrade_only }}
        run: |
          set -euo pipefail
          # Baseline for the final sync step: did this run move origin/main?
          git fetch -q origin main
          echo "start_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os, subprocess

          event = os.environ.get("EVENT_NAME", "")
          sched = os.environ.get("SCHEDULE", "")
          in_mode = os.environ.get("IN_MODE", "") or ""
          in_date = os.environ.get("IN_DATE", "") or ""
          upgrade_only = os.environ.get("IN_UPGRADE_ONLY", "") == "true"

          def emit(act, mode="auto", target=""):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"act={'true' if act else 'false'}\n")
                  f.write(f"mode={mode}\n")
                  f.write(f"target_date={target}\n")
              print(f"plan: act={act} mode={mode} target_date={target!r}")
              raise SystemExit

          if event == "workflow_dispatch":
              if upgrade_only:
                  # Idempotent upgrade: the date may have been upgraded meanwhile (e.g. by
                  # the daily's Calendar Audit while this run was queued). Read origin/main,
                  # not the checkout, which is pinned to the commit at dispatch time.
                  try:
                      t = json.loads(subprocess.check_output(
                          ["git", "show", f"origin/main:trends/{in_date}.json"],
                          stderr=subprocess.DEVNULL))
                  except Exception:
                      t = {}
                  if t.get("source_mode") != "journal-only":
                      print(f"upgrade: {in_date} is no longer journal-only; nothing to do")
                      emit(False, in_mode or "backfill", in_date)
              emit(True, in_mode or "auto", in_date)
          if sched == "0 1 * * 1":
              emit(True, "weekly")
          emit(True, "auto")  # daily schedule
          PY

      - name: Set up Node.js
        if: ${{ steps.plan.outputs.act == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify required secrets
        if: ${{ steps.plan.outputs.act == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]]; then
            echo "::error::Missing required repository secret CLAUDE_CODE_OAUTH_TOKEN."
            echo "::error::Generate it locally with 'claude setup-token' (needs a Claude Pro/Max subscription) and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ -z "${SLACK_BOT_TOKEN}" ]]; then
            echo "::warning::SLACK_BOT_TOKEN is not configured. Slack delivery will be skipped."
          fi

      - name: Install Claude Code CLI
        if: ${{ steps.plan.outputs.act == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Prepare run prompt
        if: ${{ steps.plan.outputs.act == 'true' }}
        shell: bash
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TARGET_DATE: ${{ steps.plan.outputs.target_date }}
        run: |
          set -euo pipefail
          mkdir -p out
          cat > out/ci_prompt.md <<'EOF'
          Run the arXiv Daily Briefing release workflow inside GitHub Actions.

          Repository: IIL-SNU/paper-daily-summary
          Workdir: ${WORKDIR}
          Site URL: ${SITE_URL}
          Slack channel: ${SLACK_CHANNEL}
          Slack channel ID: ${SLACK_CHANNEL_ID}
          Requested mode: ${MODE}
          Requested target date: ${TARGET_DATE}

          Follow prompts/instruction.md as the authoritative runbook.

          Required behavior:
          1. Use repository parser scripts for arXiv /new and /pastweek data.
          2. Do not summarize arXiv list pages manually.
          3. In auto mode, run Calendar Audit first and fill missing weekdays in chronological order.
          4. If target_date is older than the current /new listing date, use Backfill mode and scripts/fetch_arxiv_pastweek_date.py.
          5. Generate or update required artifacts: posts, trends, benchmarks, insights, weekly when applicable, feed.xml, index.html, and stats if present.
          6. Run the validation/release gates described in the instruction file.
          7. Commit and push only if all release gates pass.
          8. Write the Slack message body to out/slack_message.txt after success or intentional no-op.
          9. Write out/release_ok.txt after a successful release, or out/no_release.txt after an intentional no-op.
          10. If a required gate fails, exit non-zero and do not claim success.

          Git identity if a commit is needed:
          - user.name: arxiv-daily-bot
          - user.email: actions@github.com
          EOF
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('out/ci_prompt.md')
          text = p.read_text(encoding='utf-8')
          for key in ['WORKDIR', 'SITE_URL', 'SLACK_CHANNEL', 'SLACK_CHANNEL_ID', 'MODE', 'TARGET_DATE']:
              text = text.replace('${' + key + '}', os.environ.get(key, ''))
          p.write_text(text, encoding='utf-8')
          PY

      - name: Run Claude Code release agent
        if: ${{ steps.plan.outputs.act == 'true' }}
        shell: bash
        env:
          IS_SANDBOX: "1"
        run: |
          set -euo pipefail
          # Headless CI: no interactive approver, so bypass permission prompts.
          # (Safe on GitHub-hosted runners; they run as non-root 'runner'.)
          claude --dangerously-skip-permissions -p "$(cat out/ci_prompt.md)"

      - name: Finalize commit and push if Claude left validated changes
        if: ${{ steps.plan.outputs.act == 'true' }}
        shell: bash
        env:
          TARGET_DATE: ${{ steps.plan.outputs.target_date }}
        run: |
          set -euo pipefail
          git config user.name "arxiv-daily-bot"
          git config user.email "actions@github.com"

          if [[ -f out/release_ok.txt ]]; then
            echo "Release marker found. Ensuring validated changes are pushed."
            for path in posts trends benchmarks insights weekly feed.xml index.html stats; do
              if [[ -e "$path" ]]; then
                git add "$path"
              fi
            done
            if git diff --cached --quiet; then
              echo "No staged changes remain."
            else
              DATE_TAG="${TARGET_DATE:-$(date +%F)}"
              git commit -m "Update arXiv daily summary (${DATE_TAG})"
              git push origin HEAD:main
            fi
          elif [[ -f out/no_release.txt ]]; then
            echo "No-release marker found."
            cat out/no_release.txt
          else
            echo "::error::Neither out/release_ok.txt nor out/no_release.txt exists."
            exit 1
          fi

      - name: Send Slack notification (bot)
        if: ${{ always() && steps.plan.outputs.act == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SEND_SLACK}" != "true" ]]; then
            echo "Slack delivery disabled by workflow input."
            exit 0
          fi
          if [[ -z "${SLACK_BOT_TOKEN}" ]]; then
            echo "SLACK_BOT_TOKEN is not configured; skipping Slack delivery."
            exit 0
          fi
          TARGET="${SLACK_CHANNEL_ID:-$SLACK_CHANNEL}"
          if [[ -z "${TARGET}" ]]; then
            echo "::error::No Slack channel set (SLACK_CHANNEL_ID preferred, or SLACK_CHANNEL)."
            exit 1
          fi

          # Report published -> summary; run failed -> failure alert;
          # intentional no-op (weekend / no_release) -> stay silent.
          if [[ -f out/release_ok.txt ]]; then
            if [[ -f out/slack_message.txt ]]; then
              MESSAGE="$(cat out/slack_message.txt)"
            else
              MESSAGE="Imaging Intelligence Daily Briefing published. Site: ${SITE_URL}"
            fi
          elif [[ "${{ job.status }}" == "failure" ]]; then
            MESSAGE="⚠️ *Imaging Intelligence Daily Briefing failed* — 점검: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            echo "No report published and run did not fail (intentional no-op); skipping Slack."
            exit 0
          fi
          export MESSAGE TARGET

          # Build chat.postMessage payload (mrkdwn text; the agent writes out/slack_message.txt).
          python - <<'PY'
          import json, os
          payload = {
              "channel": os.environ["TARGET"],
              "text": os.environ.get("MESSAGE", ""),
              "mrkdwn": True,
              "unfurl_links": False,
          }
          with open('out/slack_payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data @out/slack_payload.json > out/slack_resp.json
          echo "Slack API response: $(cat out/slack_resp.json)"
          # Slack returns HTTP 200 with {"ok":false,"error":...} on failure — check the body.
          if ! python3 -c "import json,sys; sys.exit(0 if json.load(open('out/slack_resp.json')).get('ok') else 1)"; then
            ERR="$(python3 -c "import json; print(json.load(open('out/slack_resp.json')).get('error','unknown'))")"
            echo "::warning::Slack chat.postMessage failed: ${ERR} (run already published; not failing the job)."
          fi

      - name: Upload run artifacts
        if: ${{ always() && steps.plan.outputs.act == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: paper-daily-summary-run-${{ github.run_id }}
          path: |
            out/*.json
            out/*.txt
            out/*.md
          if-no-files-found: ignore

      # Runs last, whatever happened above. Neither action can loop: Pages triggers
      # nothing, and the poll is cron-driven and attempts each date only once.
      - name: Sync Pages deploy and upgrade poll
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          START_SHA: ${{ steps.plan.outputs.start_sha }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          set -uo pipefail
          if ! git fetch -q origin main; then
            echo "::warning::git fetch failed; skipping Pages/poll sync."
            exit 0
          fi

          # Token pushes don't fire pages.yml's push trigger, so dispatch it — only when
          # this run actually moved main.
          if [[ -n "${START_SHA}" && "$(git rev-parse origin/main)" != "${START_SHA}" ]]; then
            if gh workflow run pages.yml --ref main; then
              echo "main moved; Pages deploy dispatched."
            else
              echo "::warning::Could not dispatch the Pages deploy."
            fi
          fi

          # Daily runs own the poll: armed only while the latest daily is journal-only
          # (arXiv was late). Backfill/weekly runs leave it as is.
          case "${MODE}" in
            auto|daily)
              latest=$(git ls-tree --name-only origin/main trends/ \
                | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -n 1)
              latest_mode=$(git show "origin/main:${latest}" 2>/dev/null \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("source_mode",""))' 2>/dev/null)
              if [[ "${latest_mode}" == "journal-only" ]]; then action=enable; else action=disable; fi
              if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/arxiv-upgrade-poll.yml/${action}"; then
                echo "Latest daily ${latest} is ${latest_mode:-unknown}; upgrade poll ${action}d."
              else
                echo "::warning::Could not ${action} the upgrade poll."
              fi
              ;;
          esac
